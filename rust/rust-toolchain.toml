# The crate's declared MSRV is 1.90 (forced by kd-tree's `ordered-float`), which is newer
# than some contributors' default toolchain. Pinning the channel here means `cargo build`
# works in this repo without a `+stable` override, and everyone compiles with the same
# rustc.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
