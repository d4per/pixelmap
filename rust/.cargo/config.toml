# The default x86-64 target is SSE2-only, which has no `roundss`: `f32::round`
# then lowers to a libm `roundf` PLT call, twice per pixel in the correspondence
# scoring inner loop. Enabling the host's real feature set (SSE4.1/AVX2/FMA)
# turns those into a single instruction.
#
# This makes the binary non-portable. For a distributable build, use
# `target-cpu=x86-64-v2` (SSE4.1, universal since ~2009) as the floor instead.
#
# Scoped to the host target on purpose: under a bare [build] table these flags are
# also handed to `--target wasm32-unknown-unknown`, where LLVM rejects every one of
# them ("'skylake' is not a recognized processor for this target").
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]
