[package]
name = "pixelmap_command_line_tool"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pixelmap = { path = "../pixelmap", version = "0.1.0", default-features = false, features = ["image"] }
clap = { version = "4.5.27", features = ["derive"] }
# Only the codecs this tool actually reads and writes: the default feature set pulls in
# every format image supports, including an AVIF encoder with a heavy C-adjacent tree.
image = { version = ">=0.25, <0.25.10", default-features = false, features = ["jpeg", "png"] }

[features]
default = ["parallel"]
parallel = ["pixelmap/parallel"]
# Exposes the hidden --bench-matchers flag (see pixelmap::matcher_bench).
bench = ["pixelmap/bench"]

[[bin]]
name = "pixelmap"
path = "src/main.rs"
