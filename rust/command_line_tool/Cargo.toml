[package]
name = "pixelmap_command_line_tool"
version = "0.1.0"
edition = "2021"

[dependencies]
pixelmap = { path = "../pixelmap", version = "0.1.0", default-features = false }
clap = { version = "4.5.27", features = ["derive"] }
image = "0.24.9"

[features]
default = ["parallel"]
parallel = ["pixelmap/parallel"]
# Exposes the hidden --bench-matchers flag (see pixelmap::matcher_bench).
bench = ["pixelmap/bench"]

[[bin]]
name = "pixelmap"
path = "src/main.rs"
